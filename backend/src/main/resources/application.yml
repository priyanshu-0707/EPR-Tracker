server:
  port: 8081

spring:
  application:
    name: epr-tracker

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000

aws:
  region: ${AWS_REGION:ap-south-1}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
    table-prefix: epr-tracker-
  s3:
    bucket-name: ${S3_BUCKET_NAME:epr-compliance-reports-bucket}
    report-prefix: reports/
  bedrock:
    model-id: anthropic.claude-sonnet-4-6
    max-tokens: 1000
  sns:
    alert-topic-arn: ${SNS_TOPIC_ARN:arn:aws:sns:ap-south-1:123456789012:epr-compliance-alerts}
  location:
    map-name: epr-recycler-map
    index-name: epr-recycler-index

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
